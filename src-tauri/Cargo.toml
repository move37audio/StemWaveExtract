[package]
name = "stemwave-extract"
version = "0.1.1-beta.1"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "=0.15.4"
libc = "0.2"
stemwave_core = { path = "../crates/stemwave_core" }
