<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>StemWave Extract</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg hidden aria-hidden="true">
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
    <symbol id="i-keys" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M7.5 5v8M12 5v8M16.5 5v8M7.5 13v6M12 13v6M16.5 13v6"/></symbol>
    <symbol id="i-guitar" viewBox="0 0 24 24"><path d="m13 11 7-7M18 2l4 4"/><path d="M10 9.5a4 4 0 0 0-5 1.5L3 13.5a4.5 4.5 0 0 0 7.5 5L13 16.5a4 4 0 0 0-3-7Z"/><circle cx="8.5" cy="15.5" r="1"/></symbol>
    <symbol id="i-bass" viewBox="0 0 24 24"><path d="m12 12 8-8M17 3l4 4"/><path d="M9.5 10.5 4 16a2.8 2.8 0 0 0 4 4l5.5-5.5M8 14l2 2"/></symbol>
    <symbol id="i-drums" viewBox="0 0 24 24"><ellipse cx="12" cy="9" rx="8" ry="3"/><path d="M4 9v7c0 1.7 3.6 3 8 3s8-1.3 8-3V9M7 3l4 5M17 3l-4 5"/></symbol>
    <symbol id="i-other" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></symbol>
    <symbol id="i-rest" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" class="fill"/></symbol>
    <symbol id="i-split" viewBox="0 0 24 24"><path d="M3 12h6l4-6h8M9 12l4 6h8M18 3l3 3-3 3M18 15l3 3-3 3"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" class="fill"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z" class="fill"/></symbol>
    <symbol id="i-start" viewBox="0 0 24 24"><path d="M5 5h2.5v14H5zM19 5v14L9 12z" class="fill"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><path d="M5 4v16M10 4v16M15 4v16M20 4v16"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-loop" viewBox="0 0 24 24"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  </svg>

  <div class="app" id="app">
    <header class="titlebar">
      <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><b>StemWave</b><span>Extract</span></div>
      <div class="title-actions">
        <button id="settings-toggle" class="ghost icon" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Settings" title="Settings"><svg><use href="#i-gear"/></svg></button>
      </div>
      <div id="settings" class="settings" role="dialog" aria-label="Settings" hidden>
        <section class="settings-group">
          <h3>Appearance</h3>
          <div class="setting-line"><span>Theme</span>
            <div class="segmented small" role="radiogroup" aria-label="Theme">
              <label><input type="radio" name="theme" id="theme-dark" value="dark" checked><span>Dark</span></label>
              <label><input type="radio" name="theme" id="theme-light" value="light"><span>Light</span></label>
            </div>
          </div>
          <div class="setting-line"><span>Waveform</span>
            <div class="segmented small" role="radiogroup" aria-label="Waveform style">
              <label><input type="radio" name="wave" id="wave-spectral" value="spectral" checked><span>Spectral</span></label>
              <label><input type="radio" name="wave" id="wave-rgb" value="rgb"><span>RGB DJ</span></label>
              <label><input type="radio" name="wave" id="wave-mono" value="mono"><span>Mono</span></label>
            </div>
          </div>
        </section>
        <section class="settings-group">
          <div class="setting-line"><h3>Beat grid</h3>
            <span class="grid-line">
              <button id="grid-visible" class="switch" type="button" role="switch" aria-pressed="true" aria-label="Show beat grid"></button>
              <input id="grid-bpm" class="ctl field" type="text" inputmode="decimal" placeholder="BPM" aria-label="Tempo in BPM"><span class="muted">BPM</span>
            </span>
          </div>
        </section>
        <section class="settings-group">
          <h3>Export</h3>
          <div class="setting-line"><span>Save to</span><button id="choose-output" class="ctl folder" type="button" title="Change where stems are saved"><span id="output-name">Track’s folder</span></button></div>
          <div class="setting-line"><span>File names</span>
            <div class="segmented small" role="radiogroup" aria-label="File names">
              <label><input type="radio" name="naming" id="naming-paren" value="paren" checked><span>Track (Stem)</span></label>
              <label><input type="radio" name="naming" id="naming-dash" value="dash"><span>Track - Stem</span></label>
              <label><input type="radio" name="naming" id="naming-stem" value="stem"><span>Stem</span></label>
            </div>
          </div>
          <div class="setting-line"><span>Own folder per extraction</span><button id="subfolder" class="switch" type="button" role="switch" aria-pressed="true" aria-label="New folder for each extraction"></button></div>
          <p id="naming-example" class="example"></p>
        </section>
      </div>
    </header>

    <section class="track" aria-label="Track">
      <div class="track-body">
        <button id="choose-input" class="art" type="button" title="Open an audio file (or drop one on the window)"><img id="art-img" alt="" hidden><span class="art-empty"><svg><use href="#i-plus"/></svg><span>Add audio</span></span></button>
        <div class="track-main">
        <div class="track-title">
          <span class="eyebrow">Track</span>
          <span id="input-name" class="value">Open or drop a track</span>
          <span class="meta-line" id="meta-line" hidden><span id="length">—</span><span class="dot">·</span><span id="bpm-readout">— BPM</span><span class="dot">·</span><span>Listening to <b id="now-source">—</b></span></span>
        </div>
        <div class="overview-row">
          <span id="time" class="clock">00:00</span>
          <canvas id="overview" class="overview" aria-label="Track overview. Click or drag to seek."></canvas>
          <span id="remaining" class="clock">-00:00</span>
        </div>
        </div>
      </div>
    </section>

    <section id="lanes" class="lanes" aria-label="Sources">
    </section>


    <section class="controls-bar">
      <div class="transport" aria-label="Playback">
          <button id="play" class="ctl play" type="button" disabled aria-label="Play" title="Play (Space)"><svg id="play-icon"><use href="#i-play"/></svg></button>
          <button id="loop" class="ctl toggle icon-only" type="button" aria-pressed="true" aria-label="End loop" title="Loop" hidden><svg><use href="#i-loop"/></svg></button>
          <div class="stepper ctl" title="Bars shown"><button id="zoom-out" type="button" aria-label="Zoom out (more bars)">−</button><button id="zoom" type="button" class="zoom-value" title="Loop this many bars from the playhead">8 bars</button><button id="zoom-in" type="button" aria-label="Zoom in (fewer bars)">+</button></div>
                    <div class="stepper ctl" title="Tempo">
            <button id="tempo-half" type="button" aria-label="Half tempo" title="Half tempo: bars twice as long">½</button>
            <span id="tempo-value" class="tempo-value" title="Double-click to type a tempo">— BPM</span>
            <button id="tempo-double" type="button" aria-label="Double tempo" title="Double tempo: bars half as long">2×</button>
          </div>
          <button id="downbeat" class="ctl" type="button" title="Put a downbeat (bar line) at the playhead">Downbeat</button>
          <label class="volume ctl"><svg><use href="#i-volume"/></svg><input id="volume" type="range" min="0" max="1" step="0.01" value="0.9" aria-label="Volume"><b id="volume-value">90%</b></label>
          <span class="spacer"></span>
          <div class="segmented" role="radiogroup" aria-label="Separation quality">
            <label><input type="radio" name="mode" id="mode-fast" value="fast" checked><span>Fast</span></label>
            <label><input type="radio" name="mode" id="mode-good" value="good"><span>Good</span></label>
            <label><input type="radio" name="mode" id="mode-quality" value="quality"><span>Quality</span></label>
          </div>
          <button id="extract" class="primary" type="button" disabled><span class="label-part"><svg><use href="#i-split"/></svg><span id="extract-label">Extract</span></span><span class="arrow" aria-hidden="true">→</span></button>
        </div>
    </section>

    <section id="feedback" class="status-bar idle" aria-label="Extraction progress">
      <span class="state-dot"></span>
      <div class="status-text" role="status" aria-live="polite"><b id="stage"></b><span id="message"></span></div>
      <progress id="progress" max="100" value="0" aria-label="Extraction completion">0%</progress>
      <span id="percentage" class="percentage"></span>
      <span class="timing"><span>Elapsed <b id="elapsed">—</b></span><span>Left <b id="eta">—</b></span></span>
      <button id="cancel" class="ghost" type="button" hidden>Cancel</button>
      <button id="retry-setup" class="ghost" type="button" hidden>Try again</button>
      <button id="reveal" class="ghost" type="button" hidden>Show in Finder</button>
      <button id="save-to" class="ghost" type="button"><svg><use href="#i-folder"/></svg><span id="save-to-name">Track’s folder</span></button>
    </section>

    <div id="drop-overlay" class="drop-overlay" hidden><span>Drop to open</span></div>
  </div>
</body>
</html>
